name: mindhall
version: "0.3.2"
description: One shared mind for every AI you use. Work, dates and a signed change log that Hermes, ChatGPT, Claude and your other AIs all read and write.
requires_hermes: ">=0.23.0"
provides_tools:
  - mindhall_read
  - mindhall_update_work
  - mindhall_set_date
  - mindhall_add_note
  - mindhall_remove
provides_hooks:
  - pre_llm_call
  - post_compaction
